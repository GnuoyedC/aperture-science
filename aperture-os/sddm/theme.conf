[General]
# ---------------------------------------------------------------------------
# Aperture Protocol – SDDM theme configuration
# Local overrides can also go into theme.conf.user (same directory).
# ---------------------------------------------------------------------------

# --- Language: de | en | auto (system locale) ------------------------------
language=de

# --- Identity / HUD -----------------------------------------------------------
chamberId=test-chamber-01
osName=Aperture OS

# --- Background -----------------------------------------------------------------
# Path relative to the theme directory (or absolute). Empty = plain colour.
background=assets/background.jpg
# Extra darkening of the background image (0..1)
backgroundDim=0.25
# Default: research complex at night. The test chamber photo is assets/background-chamber.jpg
# (use it together with sceneGlows=true).
# Animated glows over the robot eye and the portal of the test chamber photo.
# Disable (or adjust coreX/coreY/portalX/portalY, relative 0..1) for other images.
sceneGlows=false
coreX=0.749
coreY=0.209
portalX=0.972
portalY=0.615
showGrid=true
showScanlines=true

# --- Colours -------------------------------------------------------------------------
colorBase=#070B0F
colorPanel=#0D151C
colorField=#070B0F
colorLine=#30424E
colorText=#D9E3E8
colorMuted=#81939E
colorOrange=#FF7800
colorOrangeBright=#FF9A3D
colorBlue=#00AEEF
colorBlueBright=#5CCDF7
colorError=#FF4545
colorButtonText=#0A0E12

# --- Typography ----------------------------------------------------------------------
fontFamily=Inter
displayFamily=Barlow Semi Condensed
monoFamily=JetBrains Mono
# Base font size in px at 1080p (scaled automatically)
fontSize=15
# Additional global UI scale factor (1.0 = automatic)
uiScale=1.0

# --- Behaviour / animation -------------------------------------------------------------
# Disable all continuous animations (weak GPUs, software rendering, accessibility)
reduceMotion=false
bootSequence=true
# Boot sequence duration in ms
bootDuration=2600
# Seconds without input until STANDBY TEST MODE (0 = never)
idleTimeout=90
# Seconds to wait for SDDM's answer before showing an error
authTimeout=20
showUserList=true
clearPasswordOnStandby=true

# --- Sound ----------------------------------------------------------------------------
sounds=true
# portal = sounds/portal (original game SFX, private use) | synth = sounds/synth
soundPack=portal
soundVolume=0.6
# Quiet facility hum loop
ambience=false
