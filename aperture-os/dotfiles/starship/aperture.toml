# Generated by tools/build-dotfiles.py from design/tokens.json - edit the tokens, not this file.
#
# Aperture OS prompt. Keeps the module set of the previous "LoFi Minimal" config
# (user, host, dir, git, php, node, ddev, docker, duration) with the Aperture rules:
#   orange -> path / prompt     cyan -> git / system state
#   gray   -> metadata          red  -> errors
#
#   ◉ user@aperture ~/projects/foo  main ✚1  php 8.3  took 3s
#   ❯
add_newline = true
palette = "aperture"

format = """
[◉](orange) \
${custom.user}\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${custom.php}\
$nodejs\
${custom.ddev}\
$docker_context\
$status\
$cmd_duration
$character"""

[palettes.aperture]
orange        = "#FF7800"
orange_bright = "#FF9A3D"
cyan          = "#00AEEF"
cyan_bright   = "#5CCDF7"
gray          = "#81939E"
dim           = "#456070"
text          = "#D9E3E8"
green         = "#4FD18B"
amber         = "#FFB000"
red           = "#FF4545"

# first name from the account's full name (like the Plasma launcher), lower case; falls back to the login name
[custom.user]
command = 'n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1 | cut -d" " -f1); echo "${n:-$USER}" | tr "[:upper:]" "[:lower:]"'
when = true
style = "text"
format = "[$output]($style)"

[hostname]
ssh_only = false
style = "gray"
format = "[@$hostname]($style) "

[directory]
style = "bold orange"
read_only = " ro"
read_only_style = "red"
truncation_length = 5
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "cyan"
format = "[$symbol$branch]($style) "

[git_state]
style = "amber"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
style = "cyan_bright"
conflicted = "[=$count](red) "
format = "([$all_status$ahead_behind]($style) )"

# replaces the built-in php module, which always asks the host php: inside a ddev project
# (searched upwards, stopping at $HOME - ~/.ddev is ddev's global config dir) the version
# comes from php_version in .ddev/config.yaml (config.*.yaml overrides win), else from php
[custom.php]
detect_files = ["composer.json", ".php-version"]
detect_extensions = ["php"]
shell = ["bash", "--noprofile", "--norc"]
command = 'd=$PWD; while [ -n "$d" ] && [ "$d" != "$HOME" ] && [ ! -f "$d/.ddev/config.yaml" ]; do d=${d%/*}; done; if [ -n "$d" ] && [ "$d" != "$HOME" ]; then v=$(sed -n "s/^php_version://p" "$d"/.ddev/config.yaml "$d"/.ddev/config.*.yaml 2>/dev/null | tail -n1 | tr -dc 0-9.); echo "${v:-?}"; else php -r "echo PHP_VERSION;"; fi'
style = "gray"
format = "[php $output ]($style)"

[nodejs]
symbol = "node "
style = "gray"
format = "[$symbol($version )]($style)"

[custom.ddev]
# only shown inside a ddev project, also in its subdirectories (~/.ddev is ddev's global config dir, not a project)
when = 'd=$PWD; while [ -n "$d" ] && [ "$d" != "$HOME" ] && [ ! -f "$d/.ddev/config.yaml" ]; do d=${d%/*}; done; [ -n "$d" ] && [ "$d" != "$HOME" ]'
shell = ["bash", "--noprofile", "--norc"]
command = 'echo ddev'
style = "cyan"
format = "[$output]($style) "

[docker_context]
symbol = "docker "
style = "gray"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 500
style = "gray"
format = "[took $duration]($style) "

[status]
disabled = false
symbol = "✕ "
style = "red"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](orange)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](cyan)"
